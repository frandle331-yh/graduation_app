<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f6ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- 装飾円 -->
  <circle cx="1050" cy="100" r="200" fill="white" fill-opacity="0.05" />
  <circle cx="150" cy="530" r="160" fill="white" fill-opacity="0.05" />
  <circle cx="980" cy="520" r="100" fill="white" fill-opacity="0.05" />

  <!-- ロゴエリア -->
  <text x="600" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4">KajiMate</text>

  <!-- サブタイトル -->
  <text x="600" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="400" fill="white" fill-opacity="0.9" text-anchor="middle">ふたりの家事を、データで見える化する</text>

  <!-- 区切り線 -->
  <rect x="480" y="355" width="240" height="3" fill="white" fill-opacity="0.4" rx="2" />

  <!-- 説明文 -->
  <text x="600" y="415" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="white" fill-opacity="0.8" text-anchor="middle">共働きカップル・夫婦向け 家事分担管理アプリ</text>

  <!-- アイコン群 -->
  <text x="320" y="510" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7" text-anchor="middle">📊 データで可視化</text>
  <text x="600" y="510" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7" text-anchor="middle">⚡ ワンタップ記録</text>
  <text x="880" y="510" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7" text-anchor="middle">👥 世帯で共有</text>
</svg>
